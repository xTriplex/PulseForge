            ${{ runner.temp }}/macos-diagnostics-performance-panel.png
            ${{ runner.temp }}/macos-document-host-smoke.log
            ${{ runner.temp }}/macos-workspace-restore-smoke.log
            ${{ runner.temp }}/macos-workspace-restore-first-launch.log
