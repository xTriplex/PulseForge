            ${{ runner.temp }}/macos-player-bundle-smoke.log
            ${{ runner.temp }}/macos-cooked-player-acceptance.log
            ${{ runner.temp }}/cooked-player-acceptance-cook.log
            ${{ runner.temp }}/cooked-player-acceptance-player.log
