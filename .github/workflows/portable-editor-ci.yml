  macos-package-only-verification:
    name: macOS · package-only standalone verification
    runs-on: macos-26
    timeout-minutes: 10
    needs: macos-desktop
    if: ${{ needs.macos-desktop.result == 'success' }}
    steps:
      - name: Download only the exported package
        uses: actions/download-artifact@v6
        with:
          name: g14-macos-arm64-package-${{ github.sha }}
          path: ${{ runner.temp }}/G14 Package Ω

      - name: Launch the read-only package without checkout or SDK environment
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/G14 Package Ω/g14-macos-package.tar.gz" -C "$RUNNER_TEMP/G14 Package Ω"
          PACKAGE="$RUNNER_TEMP/G14 Package Ω/PulseForge Standalone Ω.app"
          EXECUTABLE="$PACKAGE/Contents/MacOS/PulseForgeCookedGame"
          test -x "$EXECUTABLE"
          test -f "$PACKAGE/Contents/Resources/vulkan/icd.d/MoltenVK_icd.json"
          test -s "$PACKAGE/Contents/Resources/ThirdPartyNotices.txt"
          grep -q 'Khronos Vulkan Loader and MoltenVK' "$PACKAGE/Contents/Resources/ThirdPartyNotices.txt"
          chmod -R a-w "$PACKAGE"
          mkdir -p "$RUNNER_TEMP/G14 User Data Ω" "$RUNNER_TEMP/G14 Unrelated CWD Ω"
          USER_DATA="$RUNNER_TEMP/G14 User Data Ω/PulseForge"
          mkdir -p "$USER_DATA"
          cd "$RUNNER_TEMP/G14 Unrelated CWD Ω"
          set +e
          env -i HOME="$RUNNER_TEMP/G14 User Data Ω" TMPDIR="$RUNNER_TEMP" \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin LANG=en_US.UTF-8 \
            PULSEFORGE_USER_DATA_DIR="$USER_DATA" PULSEFORGE_COOKED_PLAYER_ACCEPTANCE=1 \
            "$EXECUTABLE" > "$RUNNER_TEMP/g14-package-only-player.log" 2>&1
          STATUS=$?
          set -e
          cat "$RUNNER_TEMP/g14-package-only-player.log"
          if [[ $STATUS -ne 0 ]]; then
            echo "Package-only Player returned $STATUS" >&2
            exit 1
          fi
          for marker in \
            PULSEFORGE_BUNDLED_VULKAN_RUNTIME=PASS \
            PULSEFORGE_COOKED_STARTUP_SCENE=PASS \
            PULSEFORGE_COOKED_INPUT_MAP=PASS \
            PULSEFORGE_COOKED_AUDIO=PASS \
            PULSEFORGE_COOKED_SCRIPT=PASS \
            PULSEFORGE_COOKED_ENVIRONMENT=PASS \
            PULSEFORGE_COOKED_RENDER_READBACK=PASS \
            PULSEFORGE_COOKED_PLAYER_SHUTDOWN=PASS; do
            grep -q "$marker" "$RUNNER_TEMP/g14-package-only-player.log"
          done
          grep -F "PULSEFORGE_COOKED_USER_DATA=PASS; root=$USER_DATA" "$RUNNER_TEMP/g14-package-only-player.log"
          grep -F "$PACKAGE/Contents/Frameworks/libvulkan.1.dylib" "$RUNNER_TEMP/g14-package-only-player.log"
          echo "G14_MACOS_PACKAGE_ONLY=PASS; no checkout; no Vulkan SDK/DYLD overrides; package read-only; unrelated CWD"

  windows-msvc:
    name: Windows 2022 · MSVC · Debug
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.validation_mode != 'automation-probe-only' && inputs.validation_mode != 'macos-desktop-only')) && (github.event_name != 'push' || (!contains(github.event.head_commit.message || '', '[automation-probe-only]') && !contains(github.event.head_commit.message || '', '[macos-desktop-only]'))) }}
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out pinned sources and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Restore pinned dependency sources
        uses: actions/cache@v5
        with:
          path: |
            Build/CI/Dependencies/pulseforgenvrhi-src
            Build/CI/Dependencies/pulseforgelua-src
            Build/CI/Dependencies/vulkan_headers-src
            Build/CI/Dependencies/_downloads
          key: ${{ runner.os }}-fetchcontent-v1-${{ hashFiles('CMake/PulseForgeDependencies.cmake', '.gitmodules') }}

      - name: Validate restored dependency sources
        shell: pwsh
        run: |
          & cmake -DPULSEFORGE_REPOSITORY_ROOT="$env:GITHUB_WORKSPACE" `
            -DPULSEFORGE_CI_DEPENDENCY_CACHE="$env:GITHUB_WORKSPACE/Build/CI/Dependencies" `
            -P CMake/PulseForgeCiDependencyCache.cmake

      - name: Configure
        shell: pwsh
        run: |
          & cmake -S . -B Build/CI/windows -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_TESTING=ON `
            -DPULSEFORGE_BUILD_EDITOR=ON `
            -DPULSEFORGE_BUILD_GPU_VALIDATION_TESTS=OFF `
            -DFETCHCONTENT_BASE_DIR="$env:GITHUB_WORKSPACE/Build/CI/Dependencies" `
            -DFETCHCONTENT_FULLY_DISCONNECTED=OFF *> "$env:RUNNER_TEMP/configure.log"
          $result = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/configure.log"
          if ($result -ne 0) { exit $result }

      - name: Build first-party tests, editor and game
        shell: pwsh
        run: |
          & cmake --build Build/CI/windows --config Debug --parallel --target PulseForgeTests PulseForgeEditor PulseForgeGame PulseForgeCook PulseForgeExport PulseForgeCookedGame PulseForgeCookedPlayerTemplate *> "$env:RUNNER_TEMP/build.log"
          $result = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/build.log"
          if ($result -ne 0) { exit $result }

      - name: Run registered CPU tests
        shell: pwsh
        run: |
          & ctest --test-dir Build/CI/windows -C Debug --output-on-failure *> "$env:RUNNER_TEMP/ctest.log"
          $result = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/ctest.log"
          if ($result -ne 0) { exit $result }

      - name: Build Release and Dist editor consumers and verify Debug fixture exclusion
        shell: pwsh
        run: |
          $coreDir = "Build/CI/windows/PulseForgeEditorCore.dir"
          $debugObject = Join-Path $coreDir "Debug/EditorDebugAcceptanceCoordinators.obj"
          if (-not (Test-Path $debugObject)) { throw "Debug coordinator object was not produced: $debugObject" }
          foreach ($configuration in @("Release", "Dist")) {
            & cmake --build Build/CI/windows --config $configuration --parallel --target `
              PulseForgeEditor PulseForgeGame PulseForgeCook PulseForgeExport PulseForgeCookedGame PulseForgeCookedPlayerTemplate `
              PulseForgeEditorCoreConsumer PulseForgeEditorTests `
              *> "$env:RUNNER_TEMP/build-$($configuration.ToLowerInvariant()).log"
            $result = $LASTEXITCODE
            Get-Content "$env:RUNNER_TEMP/build-$($configuration.ToLowerInvariant()).log"
            if ($result -ne 0) { exit $result }
            $configurationObject = Join-Path $coreDir "$configuration/EditorDebugAcceptanceCoordinators.obj"
            if (Test-Path $configurationObject) { throw "Debug-only coordinator was compiled for $configuration" }
          }

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-cmake-ctest-logs
          path: |
            ${{ runner.temp }}/configure.log
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/ctest.log
            ${{ runner.temp }}/build-release.log
            ${{ runner.temp }}/build-dist.log
            Build/CI/windows/CMakeFiles/CMakeConfigureLog.yaml
            Build/CI/windows/CMakeFiles/CMakeOutput.log
            Build/CI/windows/CMakeFiles/CMakeError.log
            Build/CI/windows/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 5

  linux-gcc:
    name: Ubuntu 24.04 · GCC · Ninja · Debug
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.validation_mode != 'automation-probe-only' && inputs.validation_mode != 'macos-desktop-only')) && (github.event_name != 'push' || (!contains(github.event.head_commit.message || '', '[automation-probe-only]') && !contains(github.event.head_commit.message || '', '[macos-desktop-only]'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out pinned sources and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Restore pinned dependency sources
        uses: actions/cache@v5
        with:
          path: |
            Build/CI/Dependencies/pulseforgenvrhi-src
            Build/CI/Dependencies/pulseforgelua-src
            Build/CI/Dependencies/vulkan_headers-src
            Build/CI/Dependencies/_downloads
          key: ${{ runner.os }}-fetchcontent-v1-${{ hashFiles('CMake/PulseForgeDependencies.cmake', '.gitmodules') }}

      - name: Validate restored dependency sources
        run: |
          cmake \
            -DPULSEFORGE_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
            -DPULSEFORGE_CI_DEPENDENCY_CACHE="$GITHUB_WORKSPACE/Build/CI/Dependencies" \
            -P CMake/PulseForgeCiDependencyCache.cmake

      - name: Install native development prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build g++ pkg-config \
            libgtk-3-dev \
            libwayland-dev libwayland-bin libwayland-cursor0 wayland-protocols libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev xauth xvfb \
            libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev mesa-vulkan-drivers

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B Build/CI/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DPULSEFORGE_BUILD_EDITOR=ON \
            -DPULSEFORGE_BUILD_GPU_VALIDATION_TESTS=OFF \
            -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/Build/CI/Dependencies" \
            -DFETCHCONTENT_FULLY_DISCONNECTED=OFF 2>&1 | tee "$RUNNER_TEMP/configure.log"

      - name: Build first-party tests, editor and game
        run: |
          set -o pipefail
          cmake --build Build/CI/linux --parallel --target PulseForgeTests PulseForgeEditor PulseForgeGame PulseForgeCook PulseForgeExport PulseForgeCookedGame PulseForgeCookedPlayerTemplate 2>&1 |
            tee "$RUNNER_TEMP/build.log"

      - name: Run registered CPU tests
        run: |
          set -o pipefail
          ctest --test-dir Build/CI/linux --output-on-failure 2>&1 | tee "$RUNNER_TEMP/ctest.log"

      - name: Cook and export an isolated standalone Linux package
        id: linux_standalone_acceptance
        run: |
          set -euo pipefail
          mapfile -t LAVAPIPE_MANIFESTS < <(
            find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print 2>/dev/null | sort
          )
          if [[ ${#LAVAPIPE_MANIFESTS[@]} -ne 1 ]]; then
            echo "Expected one installed Lavapipe Vulkan manifest; found ${#LAVAPIPE_MANIFESTS[@]}:" >&2
            find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -maxdepth 1 -type f -name '*.json' -print 2>/dev/null | sort >&2 || true
            exit 1
          fi
          DRIVER_MANIFEST="${LAVAPIPE_MANIFESTS[0]}"
          echo "Using installed Lavapipe manifest: $DRIVER_MANIFEST"
          mkdir -p "$RUNNER_TEMP/g14-exported-linux"
          python3 Tests/Platform/CookedPlayerAcceptanceTests.py
          xvfb-run -a python3 Tests/Platform/CookedPlayerAcceptance.py \
            --cook Build/CI/linux/PulseForgeCook \
            --player Build/CI/linux/PulseForgeCookedGame \
            --source-project Samples/VisualValidation/PBRMaterials/PBRMaterials.pfproj \
            --input-actions Samples/VisualValidation/GameplayInput/InputActions.json \
            --target Linux --backend Vulkan --runtime-driver-manifest "$DRIVER_MANIFEST" \
            --log-directory "$RUNNER_TEMP" --export Build/CI/linux/PulseForgeExport \
            --template-root Build/CI/linux --template-descriptor Build/CI/linux/PulseForgePlayerTemplate.json \
            --retain-export-to "$RUNNER_TEMP/g14-exported-linux/PulseForge Standalone Ω" \
            --timeout-seconds 240 2>&1 | tee "$RUNNER_TEMP/linux-standalone-acceptance.log"
          tar -czf "$RUNNER_TEMP/g14-linux-package.tar.gz" -C "$RUNNER_TEMP/g14-exported-linux" "PulseForge Standalone Ω"
          test -s "$RUNNER_TEMP/g14-linux-package.tar.gz"

      - name: Upload the verified standalone Linux package
        if: ${{ success() && steps.linux_standalone_acceptance.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: g14-linux-x64-package-${{ github.sha }}
          path: ${{ runner.temp }}/g14-linux-package.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Build Release and Dist editor consumers and verify Debug fixture exclusion
        run: |
          set -o pipefail
          for CONFIGURATION in Release Dist; do
            BUILD_DIR="Build/CI/linux-${CONFIGURATION,,}"
            cmake -S . -B "$BUILD_DIR" -G Ninja \
              -DCMAKE_BUILD_TYPE="$CONFIGURATION" \
              -DBUILD_TESTING=ON \
              -DPULSEFORGE_BUILD_EDITOR=ON \
              -DPULSEFORGE_BUILD_GPU_VALIDATION_TESTS=OFF \
              -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/Build/CI/Dependencies" \
              -DFETCHCONTENT_FULLY_DISCONNECTED=OFF 2>&1 |
              tee "$RUNNER_TEMP/configure-${CONFIGURATION,,}.log"
            cmake --build "$BUILD_DIR" --parallel --target \
              PulseForgeEditor PulseForgeGame PulseForgeCook PulseForgeExport PulseForgeCookedGame PulseForgeCookedPlayerTemplate \
              PulseForgeEditorCoreConsumer PulseForgeEditorTests 2>&1 |
              tee "$RUNNER_TEMP/build-${CONFIGURATION,,}.log"
            if find "$BUILD_DIR/CMakeFiles/PulseForgeEditorCore.dir" -name 'EditorDebugAcceptanceCoordinators.cpp.o' -print -quit | grep -q .; then
              echo "Debug-only coordinator was compiled for $CONFIGURATION" >&2
              exit 1
            fi
            EDITOR="$GITHUB_WORKSPACE/$BUILD_DIR/PulseForgeEditor"
            for FIXTURE_ARGS in "--editor-runtime-play-stop-test" "--scene-viewport-native-smoke" "--document-host-close-ui-test cancel-save"; do
              LOG="$RUNNER_TEMP/fixture-rejection-${CONFIGURATION,,}-$(printf '%s' "$FIXTURE_ARGS" | tr ' /-' '_').log"
              if "$EDITOR" $FIXTURE_ARGS >"$LOG" 2>&1; then
                echo "$CONFIGURATION accepted Debug-only fixture arguments: $FIXTURE_ARGS" >&2
                exit 1
              fi
              grep -q 'available only in Debug' "$LOG"
            done
          done

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linux-cmake-ctest-logs
          path: |
            ${{ runner.temp }}/configure.log
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/ctest.log
            ${{ runner.temp }}/configure-release.log
            ${{ runner.temp }}/build-release.log
            ${{ runner.temp }}/configure-dist.log
            ${{ runner.temp }}/build-dist.log
            ${{ runner.temp }}/linux-standalone-acceptance.log
            ${{ runner.temp }}/cooked-player-acceptance-*.log
            ${{ runner.temp }}/standalone-package-*.log
            Build/CI/linux/CMakeFiles/CMakeConfigureLog.yaml
            Build/CI/linux/CMakeFiles/CMakeOutput.log
            Build/CI/linux/CMakeFiles/CMakeError.log
            Build/CI/linux/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 5

  linux-package-only-verification:
    name: Ubuntu · package-only standalone verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: linux-gcc
    if: ${{ needs.linux-gcc.result == 'success' }}
    steps:
      - name: Install the platform software Vulkan driver and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mesa-vulkan-drivers xvfb xauth

      - name: Download only the exported package
        uses: actions/download-artifact@v6
        with:
          name: g14-linux-x64-package-${{ github.sha }}
          path: ${{ runner.temp }}/G14 Package Ω

      - name: Launch the read-only package without source checkout or SDK environment
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/G14 Package Ω/g14-linux-package.tar.gz" -C "$RUNNER_TEMP/G14 Package Ω"
          PACKAGE="$RUNNER_TEMP/G14 Package Ω/PulseForge Standalone Ω"
          EXECUTABLE="$PACKAGE/PulseForgeCookedGame"
          test -x "$EXECUTABLE"
          mapfile -t LAVAPIPE_MANIFESTS < <(
            find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print 2>/dev/null | sort
          )
          if [[ ${#LAVAPIPE_MANIFESTS[@]} -ne 1 ]]; then
            echo "Expected one installed Lavapipe Vulkan manifest; found ${#LAVAPIPE_MANIFESTS[@]}:" >&2
            find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -maxdepth 1 -type f -name '*.json' -print 2>/dev/null | sort >&2 || true
            exit 1
          fi
          DRIVER_MANIFEST="${LAVAPIPE_MANIFESTS[0]}"
          echo "Using installed Lavapipe manifest for package-only launch: $DRIVER_MANIFEST"
          chmod -R a-w "$PACKAGE"
          mkdir -p "$RUNNER_TEMP/G14 User Data Ω/PulseForge" "$RUNNER_TEMP/G14 Unrelated CWD Ω"
          USER_DATA="$RUNNER_TEMP/G14 User Data Ω/PulseForge"
          cd "$RUNNER_TEMP/G14 Unrelated CWD Ω"
          set +e
          xvfb-run -a bash -c '
            env -i HOME="$1" TMPDIR="$2" PATH=/usr/bin:/bin LANG=C.UTF-8 \
              DISPLAY="$DISPLAY" XAUTHORITY="${XAUTHORITY:-}" \
              VK_DRIVER_FILES="$3" VK_ICD_FILENAMES="$3" \
              PULSEFORGE_USER_DATA_DIR="$4" PULSEFORGE_COOKED_PLAYER_ACCEPTANCE=1 \
              "$5"
          ' _ "$RUNNER_TEMP/G14 User Data Ω" "$RUNNER_TEMP" "$DRIVER_MANIFEST" "$USER_DATA" "$EXECUTABLE" \
            > "$RUNNER_TEMP/g14-package-only-player.log" 2>&1
          STATUS=$?
          set -e
          cat "$RUNNER_TEMP/g14-package-only-player.log"
          if [[ $STATUS -ne 0 ]]; then echo "Package-only Player returned $STATUS" >&2; exit 1; fi
          for marker in \
            PULSEFORGE_COOKED_STARTUP_SCENE=PASS PULSEFORGE_COOKED_INPUT_MAP=PASS \
            PULSEFORGE_COOKED_AUDIO=PASS PULSEFORGE_COOKED_SCRIPT=PASS \
            PULSEFORGE_COOKED_ENVIRONMENT=PASS PULSEFORGE_COOKED_RENDER_READBACK=PASS \
            PULSEFORGE_COOKED_PLAYER_SHUTDOWN=PASS; do
            grep -q "$marker" "$RUNNER_TEMP/g14-package-only-player.log"
          done
          grep -F "PULSEFORGE_COOKED_USER_DATA=PASS; root=$USER_DATA" "$RUNNER_TEMP/g14-package-only-player.log"
          echo "G14_LINUX_PACKAGE_ONLY=PASS; no checkout; system Mesa lavapipe; package read-only; unrelated CWD"
