name: Portable editor CPU CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Select focused automation-probe, macOS desktop, or complete acceptance validation
        type: choice
        options:
          - full
          - automation-probe-only
          - macos-desktop-only
          - windows-asset-diagnostic-only
        default: full
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-automation-bridge:
    name: macOS · JXA permission bridge probe
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_mode != 'windows-asset-diagnostic-only') && (github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[windows-asset-diagnostic-only]')) }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Test the automation harness and permission bridge contract
        run: python3 Tests/Platform/MacOSDocumentCloseSmokeTests.py

      - name: Compile the direct Accessibility client before the engine build
        run: |
          set -euo pipefail
          AX_SOURCE="$RUNNER_TEMP/PulseForgeDirectAX.swift"
          AX_OBJECT="$RUNNER_TEMP/PulseForgeDirectAX.o"
          PYTHONPATH=Tests/Platform python3 - "$AX_SOURCE" <<'PY'
          from pathlib import Path
          import sys
          from MacOSDirectAX import SWIFT_AX_OPERATION

          Path(sys.argv[1]).write_text(SWIFT_AX_OPERATION, encoding="utf-8")
          PY
          xcrun swiftc -emit-object -sdk "$(xcrun --show-sdk-path)" "$AX_SOURCE" -o "$AX_OBJECT" \
            2>&1 | tee "$RUNNER_TEMP/macos-direct-ax-client-build.log"
          test -s "$AX_OBJECT"
          echo "PULSEFORGE_DIRECT_AX_CLIENT=COMPILED; runtime trust and operations are checked in the desktop job"

      - name: Compile the embedded Quartz helper and reject malformed calls
        run: |
          set -euo pipefail
          POINTER_SOURCE="$RUNNER_TEMP/PulseForgePointerInput.swift"
          POINTER_EXECUTABLE="$RUNNER_TEMP/PulseForgePointerInput"
          PYTHONPATH=Tests/Platform python3 - "$POINTER_SOURCE" <<'PY'
          from pathlib import Path
          import sys
          from MacOSDocumentCloseSmoke import POINTER_DRIVER_SOURCE

          Path(sys.argv[1]).write_text(POINTER_DRIVER_SOURCE, encoding="utf-8")
          PY
          xcrun swiftc -O "$POINTER_SOURCE" -framework AppKit -framework CoreGraphics -o "$POINTER_EXECUTABLE" \
            2>&1 | tee "$RUNNER_TEMP/macos-pointer-driver-build.log"
          for arguments in '123 invalid 20 20' '123 0123456789abcdef0123456789abcdef not-a-coordinate 20' \
            '--go-to-folder 123 invalid' '--press-return 123 invalid' '--type-text 123 invalid Ω'; do
            set +e
            "$POINTER_EXECUTABLE" $arguments > "$RUNNER_TEMP/macos-pointer-driver-invalid.log" 2>&1
            status=$?
            set -e
            if [[ $status -ne 2 ]] || grep -q 'CGEventPost=' "$RUNNER_TEMP/macos-pointer-driver-invalid.log"; then
              cat "$RUNNER_TEMP/macos-pointer-driver-invalid.log"
              echo "Malformed Quartz helper input was not rejected before event posting: status=$status" >&2
              exit 1
            fi
            cat "$RUNNER_TEMP/macos-pointer-driver-invalid.log"
          done
          echo "PULSEFORGE_QUARTZ_POINTER_HELPER=COMPILED; invalid_inputs=rejected_without_posting"

      - name: Compile Scene Viewport pointer helper before desktop builds
        run: |
          set -euo pipefail
          POINTER_EXECUTABLE="$RUNNER_TEMP/PulseForgeSceneViewportPointer"
          xcrun swiftc -O Tests/Platform/MacOSSceneViewportPointer.swift \
            -framework AppKit -framework CoreGraphics -o "$POINTER_EXECUTABLE" \
            2>&1 | tee "$RUNNER_TEMP/macos-scene-viewport-pointer-build.log"
          for arguments in \
            'drag-left 123 not-a-uuid 10 10 20 20' \
            'drag-left 123 0123456789abcdef0123456789abcdef nan 10 20 20'; do
            set +e
            "$POINTER_EXECUTABLE" $arguments > "$RUNNER_TEMP/macos-scene-viewport-pointer-invalid.log" 2>&1
            status=$?
            set -e
            if [[ $status -ne 2 ]] || grep -q 'SCENE_VIEWPORT_CG_EVENT' "$RUNNER_TEMP/macos-scene-viewport-pointer-invalid.log"; then
              cat "$RUNNER_TEMP/macos-scene-viewport-pointer-invalid.log"
              echo "Malformed Scene Viewport pointer input was not rejected before posting: status=$status" >&2
              exit 1
            fi
            cat "$RUNNER_TEMP/macos-scene-viewport-pointer-invalid.log"
          done
          echo "PULSEFORGE_SCENE_VIEWPORT_POINTER_HELPER=COMPILED; invalid_inputs=rejected_without_posting"

      - name: Build and import the private framework in osascript
        run: |
          set -o pipefail
          source Tests/Platform/BuildMacOSAutomationPermissionBridge.sh
          python3 Tests/Platform/MacOSAutomationClient.py 2>&1 |
            tee "$RUNNER_TEMP/macos-automation-permission-probe.log"

      - name: Upload compact bridge diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-automation-bridge-evidence
          path: |
            ${{ runner.temp }}/macos-automation-permission-bridge-build.log
            ${{ runner.temp }}/macos-automation-permission-probe.log
            ${{ runner.temp }}/macos-pointer-driver-build.log
            ${{ runner.temp }}/macos-pointer-driver-invalid.log
            ${{ runner.temp }}/macos-direct-ax-client-build.log
            ${{ runner.temp }}/macos-scene-viewport-pointer-build.log
            ${{ runner.temp }}/macos-scene-viewport-pointer-invalid.log
            ${{ runner.temp }}/PFAutomationPermission.framework/Versions/A/Resources/BridgeSupport/PFAutomationPermission.bridgesupport
          if-no-files-found: ignore
          retention-days: 1

  macos-desktop:
    name: macOS 26 · Apple Silicon · PulseForge Vulkan/MoltenVK desktop
    runs-on: macos-26
    timeout-minutes: 90
    needs: macos-automation-bridge
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || (inputs.validation_mode != 'automation-probe-only' && inputs.validation_mode != 'windows-asset-diagnostic-only')) && (github.event_name != 'push' || (!contains(github.event.head_commit.message || '', '[automation-probe-only]') && !contains(github.event.head_commit.message || '', '[windows-asset-diagnostic-only]'))) }}
    steps:
      - name: Check out sources
        id: checkout_sources
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build the Quartz input client in the desktop job
        id: desktop_pointer_client
        if: ${{ always() && !cancelled() && steps.checkout_sources.outcome == 'success' }}
        run: |
          set -euo pipefail
          POINTER_SOURCE="$RUNNER_TEMP/PulseForgePointerInput.swift"
          POINTER_EXECUTABLE="$RUNNER_TEMP/PulseForgePointerInput"
          PYTHONPATH=Tests/Platform python3 - "$POINTER_SOURCE" <<'PY'
          from pathlib import Path
          import sys
          from MacOSDocumentCloseSmoke import POINTER_DRIVER_SOURCE

          Path(sys.argv[1]).write_text(POINTER_DRIVER_SOURCE, encoding="utf-8")
          PY
          xcrun swiftc -O "$POINTER_SOURCE" -framework AppKit -framework CoreGraphics -o "$POINTER_EXECUTABLE" \
            2>&1 | tee "$RUNNER_TEMP/macos-desktop-pointer-driver-build.log"
          test -x "$POINTER_EXECUTABLE"
          echo "PULSEFORGE_DESKTOP_QUARTZ_HELPER=COMPILED; path=$POINTER_EXECUTABLE"

      - name: Test dirty-close automation protocol and bounded output capture
        id: dirty_close_harness_tests
        run: |
          set -o pipefail
          python3 Tests/Platform/MacOSDocumentCloseSmokeTests.py 2>&1 | tee "$RUNNER_TEMP/macos-document-close-harness-tests.log"
          python3 Tests/Platform/MacOSDiagnosticsCaptureSmokeTests.py 2>&1 | tee "$RUNNER_TEMP/macos-diagnostics-capture-harness-tests.log"

      - name: Build and diagnose the same-process macOS automation permission bridge
        id: macos_automation_permission_probe
        if: ${{ always() && !cancelled() && steps.checkout_sources.outcome == 'success' }}
        run: |
          set -o pipefail
          source Tests/Platform/BuildMacOSAutomationPermissionBridge.sh
          python3 Tests/Platform/MacOSAutomationClient.py 2>&1 | tee "$RUNNER_TEMP/macos-automation-permission-probe.log"

      - name: Probe hosted Metal command execution
        if: ${{ always() && !cancelled() && steps.checkout_sources.outcome == 'success' }}
        run: swift Tests/Platform/MacOSMetalCapabilityProbe.swift

      - name: Install the official Vulkan SDK in the runner temp directory
        id: install_vulkan_sdk
        if: ${{ always() && !cancelled() && steps.checkout_sources.outcome == 'success' }}
        run: |
          set -o pipefail
          SDK_VERSION=1.4.350.0
          SDK_ARCHIVE="$RUNNER_TEMP/vulkansdk-macos-${SDK_VERSION}.zip"
          SDK_URL="https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/mac/vulkansdk-macos-${SDK_VERSION}.zip"
          curl --fail --location --retry 3 "$SDK_URL" --output "$SDK_ARCHIVE" 2>&1 |
            tee "$RUNNER_TEMP/vulkan-sdk-download.log"
          echo "7acc181b8fd9b4781bf51ed086222ec95d22004b85b3d0a6683a7e48ca5a1679  $SDK_ARCHIVE" |
            shasum --check --status
          unzip -q "$SDK_ARCHIVE" -d "$RUNNER_TEMP/vulkan-sdk-installer"
          INSTALLER="$RUNNER_TEMP/vulkan-sdk-installer/vulkansdk-macOS-${SDK_VERSION}.app/Contents/MacOS/vulkansdk-macOS-${SDK_VERSION}"
          "$INSTALLER" --root "$RUNNER_TEMP/VulkanSDK/${SDK_VERSION}" --accept-licenses --default-answer \
            --confirm-command install copy_only=1
          DXC_EXECUTABLE="$RUNNER_TEMP/VulkanSDK/${SDK_VERSION}/macOS/bin/dxc"
          echo "VULKAN_SDK=$RUNNER_TEMP/VulkanSDK/${SDK_VERSION}/macOS" >> "$GITHUB_ENV"
          echo "PULSEFORGE_DXC_EXECUTABLE=$DXC_EXECUTABLE" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$RUNNER_TEMP/VulkanSDK/${SDK_VERSION}/macOS/share/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$RUNNER_TEMP/VulkanSDK/${SDK_VERSION}/macOS/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          xcodebuild -version | tee "$RUNNER_TEMP/apple-toolchain.log"
          clang --version | tee -a "$RUNNER_TEMP/apple-toolchain.log"
          "$DXC_EXECUTABLE" --version | tee -a "$RUNNER_TEMP/apple-toolchain.log"

      - name: Probe the selected MoltenVK device and capabilities
        if: ${{ always() && !cancelled() && steps.install_vulkan_sdk.outcome == 'success' }}
        run: |
          set -o pipefail
          if [[ -n "${DYLD_LIBRARY_PATH:-}" ]]; then
            echo "The SDK loader path must not leak into bundled application launches." >&2
            exit 1
          fi
          DYLD_LIBRARY_PATH="$VULKAN_SDK/lib" "$VULKAN_SDK/bin/vulkaninfo" --summary 2>&1 | tee "$RUNNER_TEMP/vulkaninfo-summary.log"
          DYLD_LIBRARY_PATH="$VULKAN_SDK/lib" "$VULKAN_SDK/bin/vulkaninfo" --show-formats > "$RUNNER_TEMP/vulkaninfo-full.log" 2>&1
          grep -Ei 'deviceName|deviceType|apiVersion|driverVersion|VK_KHR_portability_(enumeration|subset)|VK_KHR_swapchain|VK_KHR_dynamic_rendering|VK_KHR_synchronization2|VK_EXT_metal_surface|swapchainMaintenance1|timelineSemaphore|dynamicRendering|synchronization2|shaderDemoteToHelperInvocation|D32|depth' \
            "$RUNNER_TEMP/vulkaninfo-full.log" | tee "$RUNNER_TEMP/moltenvk-capabilities.log"

      - name: Configure the supported PulseForge macOS desktop targets
        id: configure_desktop_targets
        if: ${{ always() && !cancelled() && steps.checkout_sources.outcome == 'success' && steps.install_vulkan_sdk.outcome == 'success' }}
        run: |
          set -o pipefail
          cmake -S . -B Build/CI/macos-renderer -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DPULSEFORGE_BUILD_MACOS_DESKTOP=ON \
            -DPULSEFORGE_BUILD_EDITOR=ON \
            -DPULSEFORGE_BUILD_GPU_VALIDATION_TESTS=ON \
            -DPULSEFORGE_DXC_EXECUTABLE="$PULSEFORGE_DXC_EXECUTABLE" \
            -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/Build/CI/Dependencies" 2>&1 |
            tee "$RUNNER_TEMP/macos-configure.log"

      - name: Build tests, editor, player and renderer fixture
        id: build_desktop_targets
        if: ${{ always() && !cancelled() && steps.configure_desktop_targets.outcome == 'success' }}
        run: |
          set -o pipefail
          cmake --build Build/CI/macos-renderer --parallel --target \
            PulseForgeTests PulseForgeEditor PulseForgeGame PulseForgeCook PulseForgeExport PulseForgeCookedGame PulseForgeCookedPlayerTemplate PulseForgeMacOSRendererValidation \
            PulseForgeNativeDialogValidation 2>&1 |
            tee "$RUNNER_TEMP/macos-build.log"

      - name: Inspect loader lifecycle executable dependencies before environment isolation
        if: ${{ always() && !cancelled() && steps.build_desktop_targets.outcome == 'success' }}
        run: |
          set -o pipefail
          LIFECYCLE_EXECUTABLE="$GITHUB_WORKSPACE/Build/CI/macos-renderer/PulseForgeMacOSVulkanLoaderLifecycleValidation"
          otool -L "$LIFECYCLE_EXECUTABLE" | tee "$RUNNER_TEMP/macos-loader-lifecycle-otool.log"
          if grep -E 'libvulkan|MoltenVK' "$RUNNER_TEMP/macos-loader-lifecycle-otool.log"; then
            echo "The lifecycle test has a startup dependency on the Vulkan SDK; its sanitized child would fail before main." >&2
            exit 1
          fi
          for LOADER in "$VULKAN_SDK/lib/libvulkan.1.dylib" "$VULKAN_SDK/lib/libvulkan.dylib"; do
            if [ -e "$LOADER" ]; then
              otool -L "$LOADER" | tee -a "$RUNNER_TEMP/macos-loader-lifecycle-otool.log"
            fi
          done

      - name: Inspect the standalone app's bundled runtime dependencies
        if: ${{ always() && !cancelled() && steps.build_desktop_targets.outcome == 'success' }}
        run: |
          set -o pipefail
          APP="Build/CI/macos-renderer/PulseForgeCookedGame.app"
          for BINARY in \
            "$APP/Contents/MacOS/PulseForgeCookedGame" \
            "$APP/Contents/Frameworks/libvulkan.1.dylib" \
            "$APP/Contents/Frameworks/libMoltenVK.dylib"; do
            test -f "$BINARY"
            file "$BINARY" | tee -a "$RUNNER_TEMP/macos-bundled-runtime.log"
            otool -L "$BINARY" | tee -a "$RUNNER_TEMP/macos-bundled-runtime.log"
          done
          if grep -F "$VULKAN_SDK" "$RUNNER_TEMP/macos-bundled-runtime.log"; then
            echo "The standalone app retains a load command into the build SDK." >&2
            exit 1
          fi
          test -s "$APP/Contents/Resources/ThirdPartyNotices.txt"
          grep -q 'Khronos Vulkan Loader 1.4.350.0' "$APP/Contents/Resources/ThirdPartyNotices.txt"
          grep -q 'MoltenVK 1.4.1' "$APP/Contents/Resources/ThirdPartyNotices.txt"
          grep -q 'Lua 5.5.1' "$APP/Contents/Resources/ThirdPartyNotices.txt"

      - name: Run registered macOS CPU and editor tests
        id: macos_cpu_validation
        if: ${{ always() && !cancelled() && steps.build_desktop_targets.outcome == 'success' }}
        run: |
          set -o pipefail
          ctest --test-dir Build/CI/macos-renderer --output-on-failure --verbose -LE 'gpu|policy' 2>&1 |
            tee "$RUNNER_TEMP/macos-cpu-ctest.log"
          grep -q 'MACOS_VULKAN_LOADER_SANITIZED_ENV=PASS' "$RUNNER_TEMP/macos-cpu-ctest.log"
          grep -q 'MACOS_VULKAN_LOADER_EMPTY_SDK_FAILURE=PASS' "$RUNNER_TEMP/macos-cpu-ctest.log"
          grep -q 'MACOS_VULKAN_LOADER_VALID_SDK=PASS' "$RUNNER_TEMP/macos-cpu-ctest.log"
          grep -q 'MACOS_VULKAN_LOADER_LIFECYCLE=PASS' "$RUNNER_TEMP/macos-cpu-ctest.log"
          grep -q 'MACOS_VULKAN_RUNTIME_MISMATCH_POLICY=PASS' "$RUNNER_TEMP/macos-cpu-ctest.log"

      - name: Run the required PulseForge renderer policy and sensitivity fixtures
        id: macos_renderer_validation
        if: ${{ always() && !cancelled() && steps.build_desktop_targets.outcome == 'success' }}
        run: |
          set -o pipefail
          ctest --test-dir Build/CI/macos-renderer --output-on-failure --verbose \
            -R '^PulseForge\.GPU\.MacOSRenderer' 2>&1 | tee "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'Vulkan validation layer enabled' "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'NVRHI validation layer enabled' "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'Selected Vulkan GPU:' "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'Vulkan presentation retirement:' "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'MACOS_RENDERER_IMGUI_SUBMISSION=PASS' "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'MACOS_RENDERER_READBACK=PASS' "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'MACOS_RENDERER_NATIVE_RESIZE=PASS' "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'MACOS_RENDERER_WINDOW_SCALE=PASS' "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'MACOS_RENDERER_ORDERLY_SHUTDOWN=PASS' "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'MACOS_RENDERER_POLICY=auto; RESULT=RENDERED_AND_VALIDATED' "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'MACOS_RENDERER_SENSITIVITY=suppress-geometry; EXPECTED_ASSERTION_FAILURE=PASS' "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'MACOS_RENDERER_SENSITIVITY=suppress-shadow-casters; EXPECTED_ASSERTION_FAILURE=PASS' "$RUNNER_TEMP/macos-renderer-ctest.log"
          if ! grep -q 'MACOS_RENDERER_POLICY=require-fences; RESULT=RENDERED_AND_VALIDATED' \
            "$RUNNER_TEMP/macos-renderer-ctest.log" &&
            ! grep -q 'MACOS_RENDERER_STRICT_POLICY=CAPABILITY_REJECTED; rendering did not run because the exact required fence capability was unavailable' \
              "$RUNNER_TEMP/macos-renderer-ctest.log"; then
            echo "Strict presentation policy neither rendered with fences nor reported the exact unsupported capability." >&2
            exit 1
          fi
          if grep -q 'VUID-' "$RUNNER_TEMP/macos-renderer-ctest.log"; then
            echo "Khronos validation reported a Vulkan specification violation." >&2
            exit 1
          fi

      - name: Run relocated editor and player bundle smokes from unrelated working directories
        id: macos_bundle_smoke
        if: ${{ always() && !cancelled() && steps.build_desktop_targets.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 Tests/Platform/MacOSBundleSmoke.py \
            --editor-bundle Build/CI/macos-renderer/PulseForgeEditor.app \
            --editor-project Samples/VisualValidation/EditorWorkflow/EditorWorkflow.pfproj \
            --player-bundle Build/CI/macos-renderer/PulseForgeGame.app \
            --log-directory "$RUNNER_TEMP" \
            --timeout-seconds 180 2>&1 | tee "$RUNNER_TEMP/macos-bundle-smoke.log"

      - name: Cook and launch isolated PBR content with the cooked Player
        id: macos_cooked_player_acceptance
        if: ${{ always() && !cancelled() && steps.build_desktop_targets.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/g14-exported-macos"
          python3 Tests/Platform/CookedPlayerAcceptance.py \
            --cook Build/CI/macos-renderer/PulseForgeCook \
            --player Build/CI/macos-renderer/PulseForgeCookedGame.app/Contents/MacOS/PulseForgeCookedGame \
            --source-project Samples/VisualValidation/PBRMaterials/PBRMaterials.pfproj \
            --input-actions Samples/VisualValidation/GameplayInput/InputActions.json \
            --target macOS --backend Vulkan --log-directory "$RUNNER_TEMP" \
            --export Build/CI/macos-renderer/PulseForgeExport \
            --template-root Build/CI/macos-renderer/PulseForgeCookedGame.app \
            --template-descriptor Build/CI/macos-renderer/PulseForgeCookedGame.app/Contents/MacOS/PulseForgePlayerTemplate.json \
            --retain-export-to "$RUNNER_TEMP/g14-exported-macos/PulseForge Standalone Ω.app" \
            --timeout-seconds 240 2>&1 | tee "$RUNNER_TEMP/macos-cooked-player-acceptance.log"

      - name: Upload the verified macOS standalone package
        if: ${{ success() && steps.macos_cooked_player_acceptance.outcome == 'success' }}
        run: |
          set -euo pipefail
          PACKAGE_PARENT="$RUNNER_TEMP/g14-exported-macos"
          tar -czf "$RUNNER_TEMP/g14-macos-package.tar.gz" -C "$PACKAGE_PARENT" "PulseForge Standalone Ω.app"
          test -s "$RUNNER_TEMP/g14-macos-package.tar.gz"

      - name: Publish the verified macOS standalone package
        if: ${{ success() && steps.macos_cooked_player_acceptance.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: g14-macos-arm64-package-${{ github.sha }}
          path: ${{ runner.temp }}/g14-macos-package.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Exercise editor Play and Stop through the production runtime transition
        id: macos_editor_runtime_play_stop
        if: ${{ always() && !cancelled() && steps.build_desktop_targets.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 Tests/Platform/MacOSEditorRuntimePlayStopSmoke.py \
            --editor Build/CI/macos-renderer/PulseForgeEditor.app/Contents/MacOS/PulseForgeEditor \
            --project Samples/VisualValidation/EditorWorkflow/EditorWorkflow.pfproj \
            --log-directory "$RUNNER_TEMP" \
            --timeout-seconds 240 2>&1 | tee "$RUNNER_TEMP/macos-editor-runtime-play-stop-smoke.log"

      - name: Detach Scene Viewport and verify native-owner camera input
        id: macos_scene_viewport_native_smoke
        if: ${{ always() && !cancelled() && steps.build_desktop_targets.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 Tests/Platform/MacOSSceneViewportSmoke.py \
            --editor Build/CI/macos-renderer/PulseForgeEditor.app/Contents/MacOS/PulseForgeEditor \
            --project Samples/VisualValidation/EditorWorkflow/EditorWorkflow.pfproj \
            --log-directory "$RUNNER_TEMP" \
            --timeout-seconds 330 2>&1 | tee "$RUNNER_TEMP/macos-scene-viewport-native-smoke.log"

      - name: Run diagnostics capture workload and inspect the Performance utility panel
        id: macos_diagnostics_capture
        if: ${{ always() && !cancelled() && steps.build_desktop_targets.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 Tests/Platform/MacOSDiagnosticsCaptureSmoke.py \
            --editor Build/CI/macos-renderer/PulseForgeEditor.app/Contents/MacOS/PulseForgeEditor \
            --project Samples/VisualValidation/EditorWorkflow/EditorWorkflow.pfproj \
            --trace "$RUNNER_TEMP/macos-diagnostics-capture.json" \
            --log "$RUNNER_TEMP/macos-diagnostics-capture-smoke.log" \
            --screenshot "$RUNNER_TEMP/macos-diagnostics-performance-panel.png" \
            --timeout-seconds 240 2>&1 | tee "$RUNNER_TEMP/macos-diagnostics-capture-driver.log"

      - name: Verify native document hosts and synthetic tab reattachment
        id: macos_document_hosts
        if: ${{ always() && !cancelled() && steps.build_desktop_targets.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 Tests/Platform/MacOSDocumentHostSmoke.py \
            --editor Build/CI/macos-renderer/PulseForgeEditor.app/Contents/MacOS/PulseForgeEditor \
            --project Samples/VisualValidation/EditorWorkflow/EditorWorkflow.pfproj \
            --log-directory "$RUNNER_TEMP" \
            --timeout-seconds 300 2>&1 | tee "$RUNNER_TEMP/macos-document-host-smoke.log"

      - name: Exercise real Cocoa Open and Save dialogs with Accessibility automation
        id: macos_native_dialogs
        if: ${{ always() && !cancelled() && steps.build_desktop_targets.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 Tests/Platform/MacOSNativeDialogAutomation.py \
            --fixture Build/CI/macos-renderer/PulseForgeNativeDialogValidation \
            --log-directory "$RUNNER_TEMP" \
            --timeout-seconds 180 2>&1 | tee "$RUNNER_TEMP/macos-native-dialog-automation.log"

      - name: Verify native document host workspace restoration across editor restarts
        id: macos_workspace_restore
        if: ${{ always() && !cancelled() && steps.build_desktop_targets.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 Tests/Platform/MacOSWorkspaceRestoreSmoke.py \
            --editor Build/CI/macos-renderer/PulseForgeEditor.app/Contents/MacOS/PulseForgeEditor \
            --project Samples/VisualValidation/EditorWorkflow/EditorWorkflow.pfproj \
            --log-directory "$RUNNER_TEMP" \
            --timeout-seconds 240 2>&1 | tee "$RUNNER_TEMP/macos-workspace-restore-smoke.log"

      - name: Exercise dirty native document close decisions and recovery
        id: macos_document_close
        if: ${{ always() && !cancelled() && steps.build_desktop_targets.outcome == 'success' && steps.dirty_close_harness_tests.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 Tests/Platform/MacOSDocumentCloseSmoke.py \
            --editor Build/CI/macos-renderer/PulseForgeEditor.app/Contents/MacOS/PulseForgeEditor \
            --project Samples/VisualValidation/EditorWorkflow/EditorWorkflow.pfproj \
            --log-directory "$RUNNER_TEMP" \
            --timeout-seconds 240 2>&1 | tee "$RUNNER_TEMP/macos-document-close-smoke.log"

      - name: Repeat intermittent dirty-close retry cases serially
        if: ${{ always() && !cancelled() && steps.macos_document_close.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/macos-document-close-focused-repeat"
          python3 Tests/Platform/MacOSDocumentCloseSmoke.py \
            --editor Build/CI/macos-renderer/PulseForgeEditor.app/Contents/MacOS/PulseForgeEditor \
            --project Samples/VisualValidation/EditorWorkflow/EditorWorkflow.pfproj \
            --log-directory "$RUNNER_TEMP/macos-document-close-focused-repeat" \
            --timeout-seconds 240 \
            --scenario cancel-save \
            --scenario discard \
            --scenario save-retry \
            --scenario close-retry 2>&1 | tee "$RUNNER_TEMP/macos-document-close-focused-repeat.log"

      - name: Build Release and Dist editor consumers and verify Debug fixture exclusion
        if: ${{ always() && !cancelled() && steps.configure_desktop_targets.outcome == 'success' && steps.build_desktop_targets.outcome == 'success' }}
        run: |
          set -o pipefail
          DEBUG_OBJECT_DIR="Build/CI/macos-renderer/CMakeFiles/PulseForgeEditorCore.dir"
          if [ ! -d "$DEBUG_OBJECT_DIR" ]; then
            echo "Debug editor-core object directory is missing: $DEBUG_OBJECT_DIR" >&2
            exit 1
          fi
          if ! find "$DEBUG_OBJECT_DIR" -name 'EditorDebugAcceptanceCoordinators.cpp.o' -print -quit | grep -q .; then
            echo "Debug coordinator object was not produced under $DEBUG_OBJECT_DIR" >&2
            exit 1
          fi
          DEBUG_EDITOR_OBJECT_DIR="Build/CI/macos-renderer/CMakeFiles/PulseForgeEditor.dir"
          if ! find "$DEBUG_EDITOR_OBJECT_DIR" -name 'MacOSDocumentCloseEventObserver.m.o' -print -quit | grep -q .; then
            echo "Debug Cocoa event observer object was not produced under $DEBUG_EDITOR_OBJECT_DIR" >&2
            exit 1
          fi
          for CONFIGURATION in Release Dist; do
            CONFIGURATION_LOWER="$(printf '%s' "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')"
            BUILD_DIR="Build/CI/macos-$CONFIGURATION_LOWER"
            cmake -S . -B "$BUILD_DIR" -G Ninja \
              -DCMAKE_BUILD_TYPE="$CONFIGURATION" \
              -DBUILD_TESTING=ON \
              -DPULSEFORGE_BUILD_MACOS_DESKTOP=ON \
              -DPULSEFORGE_BUILD_EDITOR=ON \
              -DPULSEFORGE_BUILD_GPU_VALIDATION_TESTS=OFF \
              -DPULSEFORGE_DXC_EXECUTABLE="$PULSEFORGE_DXC_EXECUTABLE" \
              -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/Build/CI/Dependencies" \
              -DFETCHCONTENT_FULLY_DISCONNECTED=OFF 2>&1 |
              tee "$RUNNER_TEMP/macos-configure-$CONFIGURATION_LOWER.log"
            cmake --build "$BUILD_DIR" --parallel --target \
              PulseForgeEditor PulseForgeGame PulseForgeCook PulseForgeExport PulseForgeCookedGame PulseForgeCookedPlayerTemplate \
              PulseForgeEditorCoreConsumer PulseForgeEditorTests 2>&1 |
              tee "$RUNNER_TEMP/macos-build-$CONFIGURATION_LOWER.log"
            EDITOR="$GITHUB_WORKSPACE/$BUILD_DIR/PulseForgeEditor.app/Contents/MacOS/PulseForgeEditor"
            if [ ! -d "$BUILD_DIR/CMakeFiles/PulseForgeEditorCore.dir" ] || [ ! -x "$EDITOR" ]; then
              echo "Expected $CONFIGURATION editor target outputs are missing: $BUILD_DIR" >&2
              exit 1
            fi
            if find "$BUILD_DIR/CMakeFiles/PulseForgeEditorCore.dir" -name 'EditorDebugAcceptanceCoordinators.cpp.o' -print -quit | grep -q .; then
              echo "Debug-only coordinator was compiled for $CONFIGURATION" >&2
              exit 1
            fi
            if find "$BUILD_DIR/CMakeFiles/PulseForgeEditor.dir" -name 'MacOSDocumentCloseEventObserver.m.o' -print -quit | grep -q .; then
              echo "Debug-only Cocoa event observer was compiled for $CONFIGURATION" >&2
              exit 1
            fi
            for FIXTURE_ARGS in "--editor-runtime-play-stop-test" "--diagnostics-capture-smoke" "--scene-viewport-native-smoke" "--document-host-close-ui-test cancel-save"; do
              LOG="$RUNNER_TEMP/macos-fixture-rejection-$CONFIGURATION_LOWER-$(printf '%s' "$FIXTURE_ARGS" | tr ' /-' '_').log"
              python3 - "$EDITOR" "$LOG" "$FIXTURE_ARGS" <<'PY'
          import os
          import shlex
          import signal
          import subprocess
          import sys

          editor, log_path, arguments = sys.argv[1:]
          process = subprocess.Popen(
              [editor, *shlex.split(arguments)],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              start_new_session=True,
          )
          try:
              output, _ = process.communicate(timeout=15)
          except subprocess.TimeoutExpired:
              try:
                  os.killpg(process.pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              try:
                  output, _ = process.communicate(timeout=3)
              except subprocess.TimeoutExpired:
                  process.kill()
                  try:
                      output, _ = process.communicate(timeout=2)
                  except subprocess.TimeoutExpired:
                      print(f"Could not reap timed-out fixture-rejection process: {process.pid}", file=sys.stderr)
                      sys.exit(1)
              with open(log_path, "w", encoding="utf-8") as log_file:
                  log_file.write(output)
              print(f"Timed out waiting for Debug-only option rejection: {arguments}", file=sys.stderr)
              sys.exit(1)
          with open(log_path, "w", encoding="utf-8") as log_file:
              log_file.write(output)
          if process.returncode == 0:
              print(f"Release/Dist accepted Debug-only fixture arguments: {arguments}", file=sys.stderr)
              sys.exit(1)
          PY
              grep -q 'available only in Debug' "$LOG"
            done

            PACKAGE_PARENT="$RUNNER_TEMP/g14-macos-$CONFIGURATION_LOWER-package"
            mkdir -p "$PACKAGE_PARENT"
            python3 Tests/Platform/CookedPlayerAcceptance.py \
              --cook "$BUILD_DIR/PulseForgeCook" \
              --player "$BUILD_DIR/PulseForgeCookedGame.app/Contents/MacOS/PulseForgeCookedGame" \
              --source-project Samples/VisualValidation/PBRMaterials/PBRMaterials.pfproj \
              --input-actions Samples/VisualValidation/GameplayInput/InputActions.json \
              --target macOS --backend Vulkan --configuration "$CONFIGURATION" --export-only \
              --log-directory "$RUNNER_TEMP" --export "$BUILD_DIR/PulseForgeExport" \
              --template-root "$BUILD_DIR/PulseForgeCookedGame.app" \
              --template-descriptor "$BUILD_DIR/PulseForgeCookedGame.app/Contents/MacOS/PulseForgePlayerTemplate.json" \
              --retain-export-to "$PACKAGE_PARENT/PulseForge Standalone $CONFIGURATION Ω.app" \
              --timeout-seconds 240 2>&1 | tee "$RUNNER_TEMP/macos-$CONFIGURATION_LOWER-package-production.log"
            tar -czf "$RUNNER_TEMP/g14-macos-$CONFIGURATION_LOWER-package.tar.gz" \
              -C "$PACKAGE_PARENT" "PulseForge Standalone $CONFIGURATION Ω.app"
            test -s "$RUNNER_TEMP/g14-macos-$CONFIGURATION_LOWER-package.tar.gz"
          done

      - name: Run package-only desktop verifier self-test
        if: ${{ always() && !cancelled() && steps.build_desktop_targets.outcome == 'success' }}
        run: python3 Tests/Platform/StandalonePackageDesktopSmoke.py --self-test

      - name: Publish macOS Release standalone package
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: g14-macos-release-package-${{ github.sha }}
          path: ${{ runner.temp }}/g14-macos-release-package.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Publish macOS Dist standalone package
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: g14-macos-dist-package-${{ github.sha }}
          path: ${{ runner.temp }}/g14-macos-dist-package.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Publish the standalone desktop verifier
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: g14-macos-desktop-verifier-${{ github.sha }}
          path: |
            Tests/Platform/StandalonePackageDesktopSmoke.py
            Tests/Platform/AcceptanceDiagnostics.py
          if-no-files-found: error
          retention-days: 1

      - name: Upload compact renderer evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-pulseforge-desktop-evidence
          path: |
            ${{ runner.temp }}/macos-automation-permission-probe.log
