name: Portable editor CPU CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-core:
    name: macOS 15 · Apple Silicon · PulseForge Vulkan/MoltenVK renderer proof
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out sources
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Probe hosted Metal command execution
        run: swift Tests/Platform/MacOSMetalCapabilityProbe.swift

      - name: Install the official Vulkan SDK in the runner temp directory
        run: |
          set -o pipefail
          SDK_VERSION=1.4.350.0
          SDK_ARCHIVE="$RUNNER_TEMP/vulkansdk-macos-${SDK_VERSION}.zip"
          SDK_URL="https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/mac/vulkansdk-macos-${SDK_VERSION}.zip"
          curl --fail --location --retry 3 "$SDK_URL" --output "$SDK_ARCHIVE" 2>&1 |
            tee "$RUNNER_TEMP/vulkan-sdk-download.log"
          echo "7acc181b8fd9b4781bf51ed086222ec95d22004b85b3d0a6683a7e48ca5a1679  $SDK_ARCHIVE" |
            shasum --check --status
          unzip -q "$SDK_ARCHIVE" -d "$RUNNER_TEMP/vulkan-sdk-installer"
          INSTALLER="$RUNNER_TEMP/vulkan-sdk-installer/vulkansdk-macOS-${SDK_VERSION}.app/Contents/MacOS/vulkansdk-macOS-${SDK_VERSION}"
          "$INSTALLER" --root "$RUNNER_TEMP/VulkanSDK/${SDK_VERSION}" --accept-licenses --default-answer \
            --confirm-command install copy_only=1
          echo "VULKAN_SDK=$RUNNER_TEMP/VulkanSDK/${SDK_VERSION}/macOS" >> "$GITHUB_ENV"
          echo "PULSEFORGE_DXC_EXECUTABLE=$RUNNER_TEMP/VulkanSDK/${SDK_VERSION}/macOS/bin/dxc" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$RUNNER_TEMP/VulkanSDK/${SDK_VERSION}/macOS/lib" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$RUNNER_TEMP/VulkanSDK/${SDK_VERSION}/macOS/share/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$RUNNER_TEMP/VulkanSDK/${SDK_VERSION}/macOS/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          xcodebuild -version | tee "$RUNNER_TEMP/apple-toolchain.log"
          clang --version | tee -a "$RUNNER_TEMP/apple-toolchain.log"
          "$PULSEFORGE_DXC_EXECUTABLE" --version | tee -a "$RUNNER_TEMP/apple-toolchain.log"

      - name: Probe the selected MoltenVK device and capabilities
        run: |
          set -o pipefail
          "$VULKAN_SDK/bin/vulkaninfo" --summary 2>&1 | tee "$RUNNER_TEMP/vulkaninfo-summary.log"
          "$VULKAN_SDK/bin/vulkaninfo" --show-formats > "$RUNNER_TEMP/vulkaninfo-full.log" 2>&1
          grep -Ei 'deviceName|deviceType|apiVersion|driverVersion|VK_KHR_portability_(enumeration|subset)|VK_KHR_swapchain|VK_KHR_dynamic_rendering|VK_KHR_synchronization2|VK_EXT_metal_surface|swapchainMaintenance1|timelineSemaphore|dynamicRendering|synchronization2|shaderDemoteToHelperInvocation|D32|depth' \
            "$RUNNER_TEMP/vulkaninfo-full.log" | tee "$RUNNER_TEMP/moltenvk-capabilities.log"

      - name: Configure the explicit PulseForge macOS Vulkan renderer proof
        run: |
          set -o pipefail
          cmake -S . -B Build/CI/macos-renderer -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DPULSEFORGE_ENABLE_MACOS_VULKAN_PROOF=ON \
            -DPULSEFORGE_BUILD_CORE_ONLY=OFF \
            -DPULSEFORGE_BUILD_EDITOR=OFF \
            -DPULSEFORGE_BUILD_GPU_VALIDATION_TESTS=ON \
            -DPULSEFORGE_DXC_EXECUTABLE="$PULSEFORGE_DXC_EXECUTABLE" \
            -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/Build/CI/Dependencies" 2>&1 |
            tee "$RUNNER_TEMP/macos-configure.log"

      - name: Build Core checks and the PulseForge renderer proof
        run: |
          set -o pipefail
          cmake --build Build/CI/macos-renderer --parallel 2 --target \
            PulseForgeCoreTests PulseForgeCoreConsumer PulseForgeMacOSRendererValidation 2>&1 |
            tee "$RUNNER_TEMP/macos-build.log"

      - name: Run Core CPU tests and the required PulseForge renderer proof
        run: |
          set -o pipefail
          ctest --test-dir Build/CI/macos-renderer --output-on-failure --verbose \
            -R 'PulseForge\.(Core|CoreConsumer|GPU\.MacOSRenderer)$' 2>&1 |
            tee "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'Vulkan validation layer enabled' "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'NVRHI validation layer enabled' "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'Selected Vulkan GPU:' "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'Vulkan presentation retirement:' "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'MACOS_RENDERER_IMGUI_SUBMISSION=PASS' "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'MACOS_RENDERER_READBACK=PASS' "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'MACOS_RENDERER_NATIVE_RESIZE=PASS' "$RUNNER_TEMP/macos-renderer-ctest.log"
          grep -q 'MACOS_RENDERER_ORDERLY_SHUTDOWN=PASS' "$RUNNER_TEMP/macos-renderer-ctest.log"

      - name: Verify strict presentation-fence policy behavior
        run: |
          set +e
          PULSEFORGE_VULKAN_PRESENTATION_POLICY=require-fences \
            Build/CI/macos-renderer/PulseForgeMacOSRendererValidation \
            > "$RUNNER_TEMP/macos-strict-fences.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/macos-strict-fences.log"
          if [ "$result" -eq 0 ]; then
            echo "Strict presentation-fence policy rendered successfully on this device."
          elif grep -q 'No otherwise suitable Vulkan GPU satisfies PULSEFORGE_VULKAN_PRESENTATION_POLICY=require-fences' \
            "$RUNNER_TEMP/macos-strict-fences.log"; then
            echo "Strict policy rejected this device with PulseForge's explicit unsupported-capability diagnostic."
          else
            echo "Strict policy failed for a reason other than the expected device capability rejection." >&2
            exit "$result"
          fi

      - name: Upload compact renderer evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-pulseforge-renderer-evidence
          path: |
            ${{ runner.temp }}/vulkan-sdk-download.log
            ${{ runner.temp }}/apple-toolchain.log
            ${{ runner.temp }}/vulkaninfo-summary.log
            ${{ runner.temp }}/vulkaninfo-full.log
            ${{ runner.temp }}/moltenvk-capabilities.log
            ${{ runner.temp }}/macos-configure.log
            ${{ runner.temp }}/macos-build.log
            ${{ runner.temp }}/macos-renderer-ctest.log
            ${{ runner.temp }}/macos-strict-fences.log
            Build/CI/macos-renderer/CMakeFiles/CMakeConfigureLog.yaml
            Build/CI/macos-renderer/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 5

  windows-msvc:
    name: Windows 2022 · MSVC · Debug
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out pinned sources and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Restore pinned dependency sources
        uses: actions/cache@v5
        with:
          path: |
            Build/CI/Dependencies/pulseforgenvrhi-src
            Build/CI/Dependencies/pulseforgelua-src
            Build/CI/Dependencies/vulkan_headers-src
            Build/CI/Dependencies/_downloads
          key: ${{ runner.os }}-fetchcontent-v1-${{ hashFiles('CMake/PulseForgeDependencies.cmake', '.gitmodules') }}

      - name: Validate restored dependency sources
        shell: pwsh
        run: |
          & cmake -DPULSEFORGE_REPOSITORY_ROOT="$env:GITHUB_WORKSPACE" `
            -DPULSEFORGE_CI_DEPENDENCY_CACHE="$env:GITHUB_WORKSPACE/Build/CI/Dependencies" `
            -P CMake/PulseForgeCiDependencyCache.cmake

      - name: Configure
        shell: pwsh
        run: |
          & cmake -S . -B Build/CI/windows -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_TESTING=ON `
            -DPULSEFORGE_BUILD_EDITOR=ON `
            -DPULSEFORGE_BUILD_GPU_VALIDATION_TESTS=OFF `
            -DFETCHCONTENT_BASE_DIR="$env:GITHUB_WORKSPACE/Build/CI/Dependencies" `
            -DFETCHCONTENT_FULLY_DISCONNECTED=OFF *> "$env:RUNNER_TEMP/configure.log"
          $result = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/configure.log"
          if ($result -ne 0) { exit $result }

      - name: Build first-party tests, editor and game
        shell: pwsh
        run: |
          & cmake --build Build/CI/windows --config Debug --parallel 2 --target PulseForgeTests PulseForgeEditor PulseForgeGame *> "$env:RUNNER_TEMP/build.log"
          $result = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/build.log"
          if ($result -ne 0) { exit $result }

      - name: Run registered CPU tests
        shell: pwsh
        run: |
          & ctest --test-dir Build/CI/windows -C Debug --output-on-failure *> "$env:RUNNER_TEMP/ctest.log"
          $result = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/ctest.log"
          if ($result -ne 0) { exit $result }

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-cmake-ctest-logs
          path: |
            ${{ runner.temp }}/configure.log
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/ctest.log
            Build/CI/windows/CMakeFiles/CMakeConfigureLog.yaml
            Build/CI/windows/CMakeFiles/CMakeOutput.log
            Build/CI/windows/CMakeFiles/CMakeError.log
            Build/CI/windows/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 5

  linux-gcc:
    name: Ubuntu 24.04 · GCC · Ninja · Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out pinned sources and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Restore pinned dependency sources
        uses: actions/cache@v5
        with:
          path: |
            Build/CI/Dependencies/pulseforgenvrhi-src
            Build/CI/Dependencies/pulseforgelua-src
            Build/CI/Dependencies/vulkan_headers-src
            Build/CI/Dependencies/_downloads
          key: ${{ runner.os }}-fetchcontent-v1-${{ hashFiles('CMake/PulseForgeDependencies.cmake', '.gitmodules') }}

      - name: Validate restored dependency sources
        run: |
          cmake \
            -DPULSEFORGE_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
            -DPULSEFORGE_CI_DEPENDENCY_CACHE="$GITHUB_WORKSPACE/Build/CI/Dependencies" \
            -P CMake/PulseForgeCiDependencyCache.cmake

      - name: Install native development prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build g++ pkg-config \
            libgtk-3-dev \
            libwayland-dev libwayland-bin libwayland-cursor0 wayland-protocols libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B Build/CI/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DPULSEFORGE_BUILD_EDITOR=ON \
            -DPULSEFORGE_BUILD_GPU_VALIDATION_TESTS=OFF \
            -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/Build/CI/Dependencies" \
            -DFETCHCONTENT_FULLY_DISCONNECTED=OFF 2>&1 | tee "$RUNNER_TEMP/configure.log"

      - name: Build first-party tests, editor and game
        run: |
          set -o pipefail
          cmake --build Build/CI/linux --parallel 2 --target PulseForgeTests PulseForgeEditor PulseForgeGame 2>&1 |
            tee "$RUNNER_TEMP/build.log"

      - name: Run registered CPU tests
        run: |
          set -o pipefail
          ctest --test-dir Build/CI/linux --output-on-failure 2>&1 | tee "$RUNNER_TEMP/ctest.log"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linux-cmake-ctest-logs
          path: |
            ${{ runner.temp }}/configure.log
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/ctest.log
            Build/CI/linux/CMakeFiles/CMakeConfigureLog.yaml
            Build/CI/linux/CMakeFiles/CMakeOutput.log
            Build/CI/linux/CMakeFiles/CMakeError.log
            Build/CI/linux/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 5
